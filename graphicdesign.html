<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Styled Page</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: rgb(242, 215, 104);
        font-family: "Open Sans", sans-serif;
        font-weight: 600;
        margin: 20px;
        color: #222; /* Black text */
      }

      h1 {
        font-family: "League Gothic", sans-serif;
        font-weight: normal;
        font-size: 10rem;
        margin: 0;
        color: #222; /* Black headings */
      }

      h2 {
        font-family: "Open Sans", sans-serif;
        font-weight: 700;
        font-size: 2rem;
        margin-top: 20px;
        color: #222;
      }

      p {
        font-size: 1.1rem;
        max-width: 700px;
        line-height: 1.6;
        margin-bottom: 30px;
        color: #222;
      }

      .stars {
        font-size: 2.5rem;
        margin: 40px 0;
        text-align: center;
        line-height: 3.5rem;
      }

      .stars a {
        text-decoration: none;
        margin: 10px;
        color: #000;
        transition: transform 0.3s ease, color 0.3s ease;
        display: inline-block;
        cursor: pointer;
      }

      .stars a:hover {
        color: #c45c00;
        transform: scale(1.3) rotate(-5deg);
      }

      footer {
        font-family: "Open Sans", sans-serif;
        font-weight: 400;
        margin-top: 50px;
        text-align: center;
        color: #222;
      }

      img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>

  <body>
    <h1>LOGO DESIGNS</h1>

    <div class="stars">
      <a href="portfolioindex.html" title="Home Page">★</a>
      <br /><br />

      <a href="conductorpieces%20V2FINAL.jpg" title="View Full Image">
        <img src="conductorpieces%20V2FINAL.jpg" alt="Conductor Pieces" width="600" />
      </a>
    </div>

    <footer>&copy; 2025 Tami Ailster</footer>
  </body>
</html>
