<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commercial Photography</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: rgb(218, 108, 155);
        font-family: "Open Sans", sans-serif;
        font-weight: 600;
        margin: 20px;
        color: white;
      }

      h1, h2 {
        color: white;
      }

      h1 {
        font-family: "League Gothic", sans-serif;
        font-size: 10rem;
        margin: 0;
      }

      h2 {
        font-weight: 700;
        font-size: 2rem;
        margin-top: 20px;
      }

      p {
        font-size: 1.1rem;
        max-width: 700px;
        line-height: 1.6;
        color: white;
      }

      .stars {
        font-size: 3rem;
        margin: 50px 0;
        text-align: center;
      }

      .stars a {
        text-decoration: none;
        margin: 0 65px;
        color: white;
        transition: transform 0.3s ease, color 0.3s ease;
        display: inline-block;
        cursor: pointer;
      }

      .stars a:hover {
        color: #ffd700;
        transform: scale(1.3) rotate(-5deg);
      }

      footer {
        font-weight: 400;
        margin-top: 50px;
        text-align: center;
        color: white;
      }

      a {
        color: white;
        text-decoration: underline;
      }

      a:hover {
        color: #ffd700;
      }

      .centered-img {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <!-- ⭐ STAR LINKS -->
    <div class="stars">
      <a href="portfolioindex.html" title="Home Page">★</a>
    
      
    </div>

    <img src="drinks.jpg" alt="Colorful drinks displayed for commercial shoot" width="350" height="440" class="centered-img" />
    <br />
    <img src="etmacro.jpg" alt="ET macro photography piece" width="400" height="300" class="centered-img" />

    <main>
      <section>
        <h2>Commercial Photography</h2>
        <p>
          Commercial photography should never feel dull. I enjoy pushing creative boundaries to make every product stand out in a unique way.
        </p>
      </section>

      
    </main>

    <footer>&copy; 2025 Tami Ailster</footer>
  </body>
</html>
