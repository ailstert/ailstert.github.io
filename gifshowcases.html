 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Styled Page</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: rgb(242, 215, 103);
        font-family: "Open Sans", sans-serif;
        font-weight: 600;
        margin: 20px;
        color: white;
      }

      h1 {
        font-family: "League Gothic", sans-serif;
        font-weight: normal;
        font-size: 10rem;
        margin: 0;
        color: #000000;
      }

      h2 {
        font-family: "Open Sans", sans-serif;
        font-weight: 700;
        font-size: 2rem;
        margin-top: 20px;
        color: #000000;
      }

      p {
        font-size: 1.1rem;
        max-width: 700px;
        line-height: 1.6;
        color: #000000;
      }

      .stars {
        font-size: 3rem;
        margin: 50px 0;
        text-align: center;
      }

      .stars a {
        text-decoration: none;
        margin: 0 65px;
        color: #000000;
        transition: transform 0.3s ease, color 0.3s ease;
        display: inline-block;
        cursor: pointer;
      }

      .stars a:hover {
        color: #ffd700;
        transform: scale(1.3) rotate(-5deg);
      }

      footer {
        font-family: "Open Sans", sans-serif;
        font-weight: 400;
        margin-top: 50px;
        text-align: center;
        color: white;
      }

      a {
        color: white;
        text-decoration: underline;
      }

      a:hover {
        color: #ffd700;
      }

      .centered-img {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <!-- ⭐ STAR LINKS -->
    <div class="stars">
      <a href="portfolioindex.html" title="Home Page">★</a>
    </div>

    
    <h1 style="text-align: right">GIFs</h1>

    <h2>GIF SHOWCASE!</h2>
    <p>
     Some fun animated artwork. I could also animate your logo design!
         <div class="gif-section">
            <h2>Gypsy Spell</h2>
        </div>
        <img src="Project1/crystalball.gif" alt="Gypsy" width="250" height="250" />

        <div class="gif-section">
            <h2>Busy Mom</h2>
        </div>
        <img src="Project1/mother.gif" alt="Busy Mom" width="300" height="300" />

        <div class="gif-section">
            <h2>Circuit Board</h2>
        </div>
        <img src="Project1/robotgif.gif" alt="Robot" width="300" height="300" />
      

    <footer>&copy; 2025 Tami Ailster</footer>
  </body>
</html>
