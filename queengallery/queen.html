<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>The Queen's Sorrow</title>
    <style>
        body {
            background-color: antiquewhite;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            text-align: center;
            background-color: #f0e0c0;
            padding: 15px 0;
            border-bottom: 2px solid #ccc;
        }

        nav a {
            margin: 0 15px;
            font-weight: bold;
            text-decoration: none;
            color: black;
            font-size: 18px;
            position: relative;
            transition: color 0.3s ease;
        }

        nav a::before {
            content: "★ ";
            color: black;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        nav a:hover {
            color: darkred;
        }

        nav a:hover::before {
            transform: scale(1.4) rotate(-10deg);
            color: orange;
        }

        #container {
            position: relative;
            width: 1600px;
            height: 900px;
            margin: auto;
        }

        #container div {
            position: absolute;
        }

        #castle { width: 1600px; height: 900px; z-index: 0; }
        #queen { bottom: 0; left: 500px; z-index: 20; }
        #cigarette { left: 618px; top: 500px; z-index: 30; }
        #crown { left: 580px; top: 129px; z-index: 40; transform: rotate(10deg); }
        #bunny { left: 280px; top: 60px; z-index: 45; }
        #all { left: 1130px; top: 530px; z-index: 50; }
        #papertext { left: 1000px; top: 330px; z-index: 18; }
        #lips { left: 639px; top: 458px; z-index: 25; }
        #tear { left: 555px; top: 418px; z-index: 28; }
        #shadow { left: 1105px; top: 145px; z-index: 17; opacity: 0.6; }
        #fishing { left: -10px; top: 570px; z-index: 60; opacity: 0.8; }
        #rip { left: 1070px; top: 539px; z-index: 505; opacity: 0.8; }
        #scepter { left: 1060px; top: 140px; z-index: 80; }

        footer {
            text-align: center;
            margin: 40px 0 20px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>

    <nav>
